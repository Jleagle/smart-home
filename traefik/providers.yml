tls:
  options:
    default:
      minVersion: "VersionTLS12"

http:

  middlewares:
    tinyauth:
      forwardAuth:
        address: "http://tinyauth:3005/api/auth/traefik"
        trustForwardHeader: true
        maxResponseBodySize: 1048576
        authResponseHeaders:
          - "Set-Cookie"
          - "X-User"
          - "X-Email"
          - "Remote-User"
          - "Remote-Email"
          - "Remote-Groups"

  serversTransports:
    insecureTransport:
      insecureSkipVerify: true

  routers:
    adguard-route:
      rule: "Host(`adguard.jimeagle.com`)"
      service: "adguard-service"
      middlewares:
        - "tinyauth"
      entryPoints:
        - "websecure"
    bazarr-route:
      rule: "Host(`bazarr.jimeagle.com`)"
      service: "bazarr-service"
