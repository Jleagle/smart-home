# https://docs.frigate.video/configuration/index

mqtt:
  host: mosquitto

#genai:
#  gemini:
#    provider: gemini
#    api_key: '{FRIGATE_GENAI_KEY}'
#    model: gemini-2.5-flash

birdseye:
  enabled: false
  mode: motion

ffmpeg:
  # https://docs.frigate.video/configuration/hardware_acceleration
  # https://docs.frigate.video/configuration/ffmpeg_presets/
  hwaccel_args: preset-intel-qsv-h264
  input_args: preset-rtsp-restream
  output_args:
    record: preset-record-generic-audio-aac

objects:
  track:
    - person
    - dog

record:
  enabled: true

go2rtc:
  streams:
    driveway:
      - rtsp://{FRIGATE_DRIVEWAY_USERNAME}:{FRIGATE_DRIVEWAY_PASSWORD}@192.168.0.12:554/Preview_01_sub
      - "ffmpeg:driveway#audio=opus" # WebRTC needs opus, the camera sends AAC
    driveway_main:
      - rtsp://{FRIGATE_DRIVEWAY_USERNAME}:{FRIGATE_DRIVEWAY_PASSWORD}@192.168.0.12:554/Preview_01_main
      - "ffmpeg:driveway_main#audio=opus"
  webrtc:
    candidates:
      - 192.168.0.7:8555
      - stun:8555

cameras:
  driveway:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/driveway_main
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/driveway
          roles:
            - detect
    live:
      streams:
        Sub: driveway
        Main: driveway_main
    motion:
      mask:
        motion_mask_1:
          friendly_name: Time
          enabled: true
          coordinates: 0.149,0.934,0.254,0.935,0.254,0.975,0.151,0.977
        motion_mask_2:
          friendly_name: Bush
          enabled: true
          coordinates: 0,0.517,0,0,1,0,1,0.206,0.476,0.236,0.477,0.512
    zones:
      zone1:
        coordinates: 1,0.789,1,1,0,1,0,0.647
    snapshots:
      required_zones:
        - zone1
    review:
      alerts:
        required_zones:
          - zone1
      detections:
        required_zones:
          - zone1
#    objects:
#      genai:
#        enabled: false
#        use_snapshot: true
#        prompt: Describe the person in the sequence of images in one sentence. Try
#          to include the company they work for and if they are holding anything.
#        objects:
#          - person
#        required_zones:
#          - zone1
#        debug_save_thumbnails: false

snapshots:
  enabled: true
  timestamp: false
  bounding_box: true
  crop: false
  retain:
    default: 10

detectors:
  coral:
    type: edgetpu
    device: pci

ui:
  # timezone: Europe/London
  # time_format: 24hour
  # time_style: medium
  unit_system: metric

telemetry:
  version_check: false
  stats:
    amd_gpu_stats: false
    intel_gpu_stats: true
    network_bandwidth: false
detect:
  enabled: true
version: 0.18-0