[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf
    storage.path /fluent-bit/state/buffer
    storage.sync normal

# Every container's json-file log on the host
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Path_Key          filepath
    multiline.parser  docker
    DB                /fluent-bit/state/tail.db
    Mem_Buf_Limit     50MB
    storage.type      filesystem
    Skip_Long_Lines   On
    Refresh_Interval  10

# Adds container name/compose service and Cloud Logging fields
[FILTER]
    Name    lua
    Match   docker.*
    script  /fluent-bit/etc/docker.lua
    call    enrich

[OUTPUT]
    Name                       stackdriver
    Match                      docker.*
    google_service_credentials /fluent-bit/etc/google.json
    resource                   global
    Retry_Limit                5
